# Render Blueprint — backend API + managed PostgreSQL
# Docs: https://render.com/docs/blueprint-spec
#
# This file contains no secrets. Configure JWT_SECRET_KEY (if not generated)
# and FRONTEND_ORIGIN in the Render dashboard after the frontend URL is known.

databases:
  - name: deadline-dash-db
    plan: free
    databaseName: deadline_dash
    user: deadline_dash

services:
  - type: web
    name: deadline-dash-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: deadline-dash-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
